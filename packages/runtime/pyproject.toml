[project]
name = "ops_agent_runtime"
version = "0.1.7"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "kubernetes>=36.0.3",
    "langchain>=1.0,<2",
    "langgraph>=1.2.10,<2",
    "pydantic>=2.13,<3",
    "urllib3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_agent"]
