[project]
name = "ops_agent_harness"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "kubernetes>=36.0.3",
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.13,<3",
    "tomli-w>=1.2,<2",
    "urllib3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_agent"]
