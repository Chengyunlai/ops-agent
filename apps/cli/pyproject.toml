[project]
name = "ops_agent_cli"
dynamic = ["version"]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "langchain[openai]>=1.0,<2",
    "ops_agent_harness",
    "textual>=8.2,<9",
]

[project.scripts]
ops-agent = "ops_agent_cli.main:main"
ops_agent = "ops_agent_cli.main:main"

[tool.uv.sources]
ops_agent_harness = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ops_agent_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_agent_cli"]
