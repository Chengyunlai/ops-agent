[project]
name = "ops_agent_cli"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langchain[openai]>=1.0,<2",
    "ops_agent_harness",
]

[project.scripts]
ops_agent = "ops_agent_cli.main:main"

[tool.uv.sources]
ops_agent_harness = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_agent_cli"]
