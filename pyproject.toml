[project]
name = "ops_agent"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ops_agent_cli",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.uv.sources]
ops_agent_cli = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/cli",
    "packages/harness",
]

[tool.pytest.ini_options]
testpaths = [
    "apps",
    "packages",
]
