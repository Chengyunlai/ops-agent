[project]
name = "ops_agent"
version = "0.1.6"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "ops_agent_cli",
]

[dependency-groups]
build = [
    "pyinstaller>=6.16,<7",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.uv]
package = false

[tool.uv.sources]
ops_agent_cli = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/cli",
    "packages/harness",
]

[tool.pytest.ini_options]
testpaths = [
    "apps",
    "packages",
]
markers = [
    "kubernetes_integration: requires an explicitly selected disposable kind cluster",
]
