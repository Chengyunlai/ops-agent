[project]
name = "ops_agent"
version = "0.1.10"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "ops_agent_cli",
]

[dependency-groups]
build = [
    "pyinstaller>=6.16,<7",
]
dev = [
    "pyyaml>=6.0.3,<7",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.uv]
package = false

[tool.uv.sources]
ops_agent_cli = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/cli",
    "packages/runtime",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
testpaths = [
    "apps",
    "packages",
    "tests",
]
markers = [
    "kubernetes_integration: requires an explicitly selected disposable kind cluster",
]
