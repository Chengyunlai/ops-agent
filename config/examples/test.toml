[project]
name = "Testing"

[kubernetes]
environment = "test"
namespace = "YOUR_NAMESPACE"
kubeconfig_path = "/absolute/path/to/test-kubeconfig"
request_timeout_seconds = 10

[kubernetes.interactive_exec]
enabled = false

[kubernetes.downloads]
directory = "~/Downloads/ops-agent"

[model]
provider = "openai"
model = "deepseek-v4-pro"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"

[tui]
theme = "ops-dark"

[tui.colors]
# primary = "#1FB5AD"
# accent = "#FFCC66"
# background = "#070A0D"
# foreground = "#D7DEE7"
# warning = "#FFCC66"
