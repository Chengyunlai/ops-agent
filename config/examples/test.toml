[project]
name = "Testing"

[project.log_focus]
hide_info = false
hide_debug = false
hide_health_checks = false
hide_access_logs = false
hidden_text = []

[kubernetes]
environment = "test"
namespace = "YOUR_NAMESPACE"
kubeconfig_path = "/absolute/path/to/test-kubeconfig"
request_timeout_seconds = 10

[kubernetes.watch]
enabled = true
timeout_seconds = 10
poll_interval_seconds = 5.0

[kubernetes.metrics]
enabled = true
request_timeout_seconds = 3
cache_ttl_seconds = 10.0

[kubernetes.interactive_exec]
enabled = false
locale = "auto"
terminal_type = "xterm-256color"
color = true

[kubernetes.downloads]
directory = "~/Downloads/ops-agent"

[kubernetes.pod_transfer]
strategy = "auto"
max_file_size_mb = 512

[model]
provider = "openai"
model = "deepseek-v4-pro"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"

[tui]
theme = "ops-dark"

[tui.colors]
# primary = "#1FB5AD"
# accent = "#FFCC66"
# background = "#070A0D"
# foreground = "#D7DEE7"
# warning = "#FFCC66"
