[project]
name = "Production"

[kubernetes]
environment = "prod"
namespace = "YOUR_NAMESPACE"
kubeconfig_path = "/absolute/path/to/prod-kubeconfig"
request_timeout_seconds = 10

[kubernetes.interactive_exec]
enabled = false

[kubernetes.downloads]
directory = "~/Downloads/ops-agent"

[model]
provider = "openai"
model = "deepseek-v4-pro"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"

[tui]
theme = "high-contrast"

[tui.colors]
# primary = "#00FFFF"
# accent = "#FFFF00"
# background = "#000000"
# foreground = "#FFFFFF"
# warning = "#FFFF00"
