[project]
name = "Production"

[kubernetes]
environment = "prod"
namespace = "YOUR_NAMESPACE"
kubeconfig_path = "/absolute/path/to/prod-kubeconfig"
request_timeout_seconds = 10

[kubernetes.watch]
enabled = true
timeout_seconds = 10
poll_interval_seconds = 5.0

[kubernetes.interactive_exec]
enabled = false
locale = "auto"
terminal_type = "xterm-256color"
color = true

[kubernetes.downloads]
directory = "~/Downloads/ops-agent"

[kubernetes.pod_transfer]
strategy = "auto"
max_file_size_mb = 512

[model]
provider = "openai"
model = "deepseek-v4-pro"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"

[tui]
theme = "high-contrast"

[tui.colors]
# primary = "#00FFFF"
# accent = "#FFFF00"
# background = "#000000"
# foreground = "#FFFFFF"
# warning = "#FFFF00"
