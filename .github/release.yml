changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking Changes
      labels:
        - breaking
    - title: Features
      labels:
        - type:feature
    - title: Fixes
      labels:
        - type:fix
    - title: Security
      labels:
        - type:security
    - title: Documentation
      labels:
        - type:docs
    - title: Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
