name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag is on main
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use v<major>.<minor>.<patch>." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          git merge-base --is-ancestor "${tag_commit}" origin/main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Run full checks
        run: make check

  build:
    name: Build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-amd64
          - runner: ubuntu-24.04
            target: linux-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public release prerequisites
        run: |
          if [ ! -f LICENSE ]; then
            echo "Public release blocked: select and add a LICENSE first." >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked build dependencies
        run: uv sync --locked --no-default-groups --group build
      - name: Verify tag version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(uv run ops-agent --version)" = "ops-agent ${version}"
      - name: Build standalone application bundle
        run: uv run pyinstaller --clean --noconfirm packaging/ops-agent.spec
      - name: Smoke test installed interfaces
        shell: bash
        run: |
          ./dist/ops-agent/ops-agent --version
          config_home="${RUNNER_TEMP}/ops-agent-config-${{ matrix.target }}"
          XDG_CONFIG_HOME="${config_home}" ./dist/ops-agent/ops-agent init
          XDG_CONFIG_HOME="${config_home}" ./dist/ops-agent/ops-agent config path
          test -f "${config_home}/ops-agent/config.toml"
          set +e
          provider_smoke="$(
            DEEPSEEK_API_KEY=dummy \
              ./dist/ops-agent/ops-agent \
              --config config/examples/test.toml \
              ask "检查 Pod" 2>&1
          )"
          provider_status=$?
          set -e
          test "${provider_status}" -eq 1
          grep -F "无法加载 kubeconfig" <<<"${provider_smoke}"
      - name: Create release archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run python scripts/create_release_archive.py \
            --bundle dist/ops-agent \
            --version "${version}" \
            --target "${{ matrix.target }}" \
            --output-directory release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Write checksums
        run: uv run python scripts/write_release_checksums.py release
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release/*.tar.gz
            release/SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/SHA256SUMS
